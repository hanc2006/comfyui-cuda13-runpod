name: Build and push image

# Builds the image on GitHub's runners and pushes it to Docker Hub.
# Settings -> Secrets and variables -> Actions:
#   Secrets:
#     DOCKERHUB_USERNAME   login name (Docker ID or email)
#     DOCKERHUB_TOKEN      Docker Hub access token with Read & Write access
#   Variable (or secret):
#     DOCKERHUB_NAMESPACE  your Docker ID (lowercase, no @) - the image becomes
#                          <DOCKERHUB_NAMESPACE>/<IMAGE_NAME>. Needed when the login
#                          name is an email; otherwise the login name is used.
#   Variable:
#     IMAGE_NAME           optional, default comfyui-cuda13

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, comfyui-ctl.sh, tests/kokon-permissions.sh, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      torch_version:
        description: "Pin torch/torchaudio (e.g. 2.11.0). Empty = newest on the cu130 index"
        required: false
        default: ""
      comfy_ref:
        description: "ComfyUI branch or tag"
        required: false
        default: "master"
      image:
        description: "Image to build"
        type: choice
        options: [both, kokon, comfyui]
        default: both

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The image is ~10 GB; the runner needs room for build layers.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Test Kokon volume permissions
        run: bash tests/kokon-permissions.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          NAME: ${{ vars.IMAGE_NAME || 'comfyui-cuda13' }}
        run: |
          NAMESPACE="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]' | xargs)"
          if ! [[ "$NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Image namespace is not a valid Docker ID (an email or other invalid characters). Set the repository variable DOCKERHUB_NAMESPACE to your Docker ID."
            exit 1
          fi
          IMAGE="${NAMESPACE}/${NAME}"
          echo "Image: ${IMAGE}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "kokon_tags=${IMAGE}-kokon:latest,${IMAGE}-kokon:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ComfyUI image
        if: github.event.inputs.image != 'kokon'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TORCH_VERSION=${{ github.event.inputs.torch_version || '' }}
            COMFY_REF=${{ github.event.inputs.comfy_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Kokon image
        if: github.event.inputs.image != 'comfyui'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: kokon
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.kokon_tags }}
          build-args: |
            TORCH_VERSION=${{ github.event.inputs.torch_version || '' }}
            COMFY_REF=${{ github.event.inputs.comfy_ref || 'master' }}
          cache-from: type=gha
